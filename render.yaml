services:
  - type: web
    name: wordsort
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 180
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: APP_USER
        value: tutor
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: wordsort-data
      mountPath: /var/data
      sizeGB: 5
